name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Типы
        run: npm run typecheck

      - name: Линтер
        run: npm run lint

      - name: Тесты
        run: npm test

      # Паки в data/packs и их медиа в uploads/: вопрос работает вслух,
      # медиа на месте, пак проходит проверку перед игрой.
      - name: Паки
        run: npm run lint:packs

      - name: Сборка клиента
        run: npm run build
